<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Blue Gradient matching BharatNivas Brand -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Shimmer Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Smooth Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    @keyframes floatBounce {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-2px) scale(1.04);
      }
    }
    @keyframes pulseRing {
      0%, 100% {
        opacity: 0.95;
      }
      50% {
        opacity: 1;
      }
    }
    .building-body {
      transform-origin: 32px 34px;
      animation: floatBounce 2.5s ease-in-out infinite;
    }
    .badge-bg {
      animation: pulseRing 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Blue Rounded Squircle Badge -->
  <rect class="badge-bg" x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Animated White Building Icon -->
  <g class="building-body">
    <!-- Left Wing Building -->
    <path d="M15 28 C15 26 16.5 24.5 18.5 24.5 C20.5 24.5 22 26 22 28 L22 47 L15 47 Z" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Wing Building -->
    <path d="M42 28 C42 26 43.5 24.5 45.5 24.5 C47.5 24.5 49 26 49 28 L49 47 L42 47 Z" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center Tower with Rounded Arch -->
    <path d="M22 21 C22 17.2 24.8 14.5 28.5 14.5 L35.5 14.5 C39.2 14.5 42 17.2 42 21 L42 47 L22 47 Z" 
          fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upper Window Bar -->
    <line x1="28" y1="23" x2="36" y2="23" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Middle Window Bar -->
    <line x1="28" y1="31" x2="36" y2="31" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Arched Entrance Doorway -->
    <path d="M28.5 47 L28.5 41 C28.5 39 30 37.5 32 37.5 C34 37.5 35.5 39 35.5 41 L35.5 47" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>